[project]
name = "stroydoc-backend"
version = "0.1.0"
description = "StroyDoc API — контроль комплектности строительной документации"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "celery[redis]>=5.4",
    "minio>=7.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # B008: Depends() в аргументах — идиома FastAPI; UP042: StrEnum не нужен

[tool.pytest.ini_options]
testpaths = ["tests"]
